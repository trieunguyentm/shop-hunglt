# Toàn bộ hệ thống trong 1 lệnh:  docker compose up -d --build   (từ thư mục code/)
# Gồm: PostgreSQL · Keycloak · Backend (Express/Prisma) · Frontend (Next.js)
#
# Mạng OIDC: trình duyệt gọi Keycloak qua http://localhost:8080 (cổng publish); các container
# gọi nội bộ qua http://keycloak:8080 (Docker network). Auth.js/backend tự viết lại host
# localhost→keycloak cho request server-side, nên issuer vẫn là localhost (khớp token trình duyệt)
# mà không cần sửa /etc/hosts. Đăng nhập tại http://localhost:3000.
services:
  postgres:
    image: postgres:16
    container_name: fashion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fashion_shop
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fashion-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_ENABLED: 'true'
      # Issuer/endpoint Keycloak quảng bá ra ngoài = localhost (cho trình duyệt). Server-side
      # gọi nội bộ qua keycloak:8080 và được Auth.js/backend viết lại host nên vẫn khớp issuer.
      KC_HOSTNAME: http://localhost:8080
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak/realm-fashion-shop.json:/opt/keycloak/data/import/realm-fashion-shop.json:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: fashion-backend
    env_file:
      - ./backend/.env.prod
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Biến browser (nướng vào bundle lúc build)
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:8080/realms/fashion-shop
    container_name: fashion-frontend
    env_file:
      - ./frontend/.env.prod
    ports:
      - '3000:3000'
    depends_on:
      - backend
      - keycloak

volumes:
  pg_data:
